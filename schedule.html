<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="View sports match scores and match status on Live Games Today.">
<title>Live Scores | Live Games Today</title>
<link rel="stylesheet" href="style.css">
<style>
.controls { display:flex; flex-wrap:wrap; gap:10px; margin:18px 0; }
select, .refresh {
  padding:11px 14px; border-radius:8px; border:1px solid #35425a;
  background:#111827; color:#fff; font-size:16px;
}
.refresh { background:#00f5d4; color:#071014; font-weight:bold; }
.match { background:#111827; border:1px solid #273248; border-radius:14px;
  padding:18px; margin-bottom:14px; }
.match-top { display:flex; justify-content:space-between; gap:12px;
  color:#a5b0c5; font-size:13px; margin-bottom:12px; }
.teamrow { display:flex; justify-content:space-between; align-items:center;
  gap:12px; padding:7px 0; font-weight:bold; }
.score { color:#00f5d4; font-size:21px; min-width:35px; text-align:right; }
#message { color:#a5b0c5; padding:12px 0; }
.attribution { margin-top:24px; font-size:13px; }
.attribution a { color:#00f5d4; }
  /* Extra styling for match cards */
.match {
background: linear-gradient(135deg, #111827, #172338);
border: 1px solid #00f5d4;
border-radius: 16px;
padding: 18px;
margin-bottom: 16px;
box-shadow: 0 6px 20px rgba(0, 245, 212, 0.08);
}

.match-top {
display: flex;
flex-wrap: wrap;
justify-content: space-between;
gap: 8px;
color: #00f5d4;
font-size: 13px;
margin-bottom: 14px;
text-transform: uppercase;
letter-spacing: 0.4px;
}

.teamrow {
display: flex;
justify-content: space-between;
align-items: center;
gap: 12px;
padding: 10px 0;
font-weight: 700;
border-bottom: 1px solid #273248;
}

.teamrow:last-child {
border-bottom: none;
}

.score {
color: #00f5d4;
font-size: 23px;
font-weight: 800;
}

.refresh {
cursor: pointer;
transition: transform 0.2s ease, opacity 0.2s ease;
}

.refresh:hover {
transform: translateY(-2px);
opacity: 0.9;
}

.refresh:disabled {
opacity: 0.6;
cursor: wait;
}

@media (max-width: 600px) {
.match {
padding: 14px;
}

.teamrow {
font-size: 14px;
overflow-wrap: anywhere;
}

.score {
font-size: 20px;
flex-shrink: 0;
}

.controls select,
.controls .refresh {
width: 100%;
}
}
</style>
</head>
<body>
<header>
<a class="logo" href="index.html">⚡ LIVE GAMES TODAY</a>
<nav>
<a href="index.html">Home</a>
<a class="active" href="schedule.html">Schedule</a>
<a href="news.html">Sports News</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
</nav>
</header>

<main>
<section class="hero">
<h1>Live <span>Scores</span></h1>
<p class="muted">Match scores and status from a sports data API.</p>
</section>

<div class="controls">
<select id="sport" aria-label="Choose sport">
<option value="football">⚽ Football</option>
<option value="cricket">🏏 Cricket</option>
<option value="basketball">🏀 Basketball</option>
<option value="tennis">🎾 Tennis</option>
</select>
<button class="refresh" id="refresh">Refresh scores</button>
</div>

<p id="message" role="status">Loading scores...</p>
<section id="matches" aria-live="polite"></section>

<p class="attribution">
Sports data provided by
<a href="https://sportscore.com/" rel="dofollow" target="_blank">SportScore</a>.
Data availability and update frequency depend on the provider.
</p>
</main>

<footer>© 2026 Live Games Today</footer>

<script>
const sportSelect = document.getElementById("sport");
const matchesEl = document.getElementById("matches");
const messageEl = document.getElementById("message");
const refreshBtn = document.getElementById("refresh");

function safeText(value, fallback = "TBD") {
  return typeof value === "string" || typeof value === "number"
    ? String(value) : fallback;
}
function makeMatch(match) {
  const card = document.createElement("article");
  card.className = "match";

  // Match status and time
  const top = document.createElement("div");
  top.className = "match-top";

  const status = safeText(
    match.status_text || match.status,
    "Status unavailable"
  );

  const statusBadge = document.createElement("span");
  statusBadge.textContent = status;
  statusBadge.style.fontWeight = "800";

  const normalizedStatus = status.toLowerCase();
  if (
    normalizedStatus.includes("live") ||
    normalizedStatus.includes("half") ||
    normalizedStatus.includes("quarter") ||
    normalizedStatus.includes("in progress")
  ) {
    statusBadge.style.color = "#00f5d4";
  } else if (normalizedStatus.includes("finished")) {
    statusBadge.style.color = "#a5b0c5";
  } else {
    statusBadge.style.color = "#facc15";
  }

  top.appendChild(statusBadge);

  const time = match.time ? new Date(match.time) : null;
  if (time && !Number.isNaN(time.getTime())) {
    const timeLabel = document.createElement("span");
    timeLabel.textContent = time.toLocaleString();
    top.appendChild(timeLabel);
  }

  card.appendChild(top);

  // Competition or league name
  if (match.competition) {
    const league = document.createElement("div");
    league.textContent = "🏆 " + safeText(match.competition);
    league.style.color = "#a5b0c5";
    league.style.fontSize = "13px";
    league.style.marginBottom = "12px";
    card.appendChild(league);
  }

  // Team row with optional logo and score
  function addTeam(name, logo, score) {
    const row = document.createElement("div");
    row.className = "teamrow";

    const teamInfo = document.createElement("div");
    teamInfo.style.display = "flex";
    teamInfo.style.alignItems = "center";
    teamInfo.style.gap = "10px";
    teamInfo.style.minWidth = "0";
    teamInfo.style.flex = "1";

    if (typeof logo === "string" && /^https:\/\//i.test(logo)) {
      const img = document.createElement("img");
      img.src = logo;
      img.alt = "";
      img.width = 28;
      img.height = 28;
      img.loading = "lazy";
      img.style.objectFit = "contain";
      img.style.flexShrink = "0";
      img.onerror = () => img.remove();
      teamInfo.appendChild(img);
    }

    const team = document.createElement("span");
    team.textContent = safeText(name);
    team.style.overflowWrap = "anywhere";
    teamInfo.appendChild(team);

    const points = document.createElement("span");
    points.className = "score";
    points.textContent =
      score === null || score === undefined || score === ""
        ? "—"
        : safeText(score, "—");

    row.append(teamInfo, points);
    card.appendChild(row);
  }

  addTeam(match.home, match.home_logo, match.home_score);
  addTeam(match.away, match.away_logo, match.away_score);

  return card;
}

  }

  addTeam(match.home, match.home_score);
  addTeam(match.away, match.away_score);
  return card;
}

async function loadScores() {
  const sport = sportSelect.value;
  refreshBtn.disabled = true;
  matchesEl.replaceChildren();
  messageEl.textContent = "Loading " + sport + " scores...";

  try {
    const url = "https://sportscore.com/api/widget/matches/?sport="
      + encodeURIComponent(sport) + "&limit=20&src=live-games-today";

    const response = await fetch(url);
    if (!response.ok) throw new Error("API returned HTTP " + response.status);

    const data = await response.json();
    if (!Array.isArray(data.matches)) {
      throw new Error("Unexpected response format");
    }

    if (data.matches.length === 0) {
      messageEl.textContent =
        "No matches are available right now. Try refreshing later.";
      return;
    }

    const fragment = document.createDocumentFragment();
    data.matches.forEach(match => fragment.appendChild(makeMatch(match)));
    matchesEl.appendChild(fragment);
    messageEl.textContent = "Showing " + data.matches.length +
      " matches · Last checked: " + new Date().toLocaleTimeString();
  } catch (error) {
    messageEl.textContent =
      "Could not load scores. Check your internet connection and try again.";
    console.error("Scores API error:", error);
  } finally {
    refreshBtn.disabled = false;
  }
}

refreshBtn.addEventListener("click", loadScores);
sportSelect.addEventListener("change", loadScores);
loadScores();
setInterval(loadScores, 60000);
</script>
</body>
</html>
