
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Follow cricket live scores, match updates and cricket information on Live Games Today.">
  <title>Cricket Live Scores | Live Games Today</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080d18;
      color: #f4f7ff;
    }
    header {
      padding: 22px 16px;
      background: #101a2b;
      border-bottom: 1px solid #253b55;
    }
    header h1 { margin: 0 0 8px; color: #47ffd0; }
    header p { margin: 0; color: #aabbd1; }
    nav { margin-top: 16px; display: flex; gap: 14px; flex-wrap: wrap; }
    a { color: #47ffd0; text-decoration: none; }
    main { max-width: 850px; margin: auto; padding: 18px 12px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    button, select {
      background: #14253a;
      color: white;
      border: 1px solid #36516e;
      padding: 11px 14px;
      border-radius: 9px;
      font-size: 15px;
    }
    button { cursor: pointer; }
    button:hover { border-color: #47ffd0; }
    #message { color: #aabbd1; margin: 12px 0; }
    .match {
      background: #101a2b;
      border: 1px solid #253b55;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 13px;
    }
    .league { color: #47ffd0; font-size: 13px; margin-bottom: 12px; }
    .teams { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; }
    .team { font-weight: bold; overflow-wrap: anywhere; }
    .team:last-child { text-align: right; }
    .score { font-size: 18px; font-weight: bold; text-align: center; }
    .status { color: #ffd166; font-size: 13px; margin-top: 13px; }
    .time { color: #aabbd1; font-size: 12px; margin-top: 7px; }
    .details { display: inline-block; margin-top: 12px; font-size: 13px; }
    footer { text-align: center; padding: 22px; color: #8295ad; font-size: 12px; }
  </style>
  <link rel="canonical" href="https://bxdevil55-coder.github.io/live-games-today/cricket.html">
</head>
<body>
  <header>
    <h1>🏏 Live Games Today</h1>
    <p>Cricket Live Scores & Match Schedule</p>
    <nav>
      <a href="index.html">Home</a>
      <a href="schedule.html">⚽ Football</a>
      <a href="cricket.html">🏏 Cricket</a>
    </nav>
  </header>

  <main>
    <div class="toolbar">
      <select id="filter" aria-label="Filter matches">
        <option value="all">All matches</option>
        <option value="live">Live matches</option>
        <option value="upcoming">Upcoming matches</option>
      </select>
      <button id="refresh">↻ Refresh Scores</button>
    </div>

    <p id="message">Loading cricket matches...</p>
    <section id="matches"></section>
  </main>

  <footer>Match data provided by SportScore. Scores may be delayed or unavailable.</footer>

  <script>
    const API = "https://sportscore.com/api/widget/matches/?sport=cricket&limit=50&src=live-games-today";
    const matchesBox = document.getElementById("matches");
    const message = document.getElementById("message");
    const filter = document.getElementById("filter");
    let matches = [];

    function safe(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#39;"
      })[c]);
    }

    function score(value) {
      return value === null || value === undefined || value === ""
        ? "—" : safe(value);
    }

    function showMatches() {
      const selected = filter.value;
      const visible = matches.filter(m =>
        selected === "all" || m.status === selected
      );

      message.textContent = `${visible.length} matches shown · Data refreshes every 60 seconds`;

      if (!visible.length) {
        matchesBox.innerHTML = '<p>No matches found for this filter.</p>';
        return;
      }

      matchesBox.innerHTML = visible.map(m => {
        const homeScore = score(m.home_score);
        const awayScore = score(m.away_score);
        const hasScore = homeScore !== "—" && awayScore !== "—"
          && homeScore !== "-" && awayScore !== "-";
        const matchUrl = m.url && m.url.startsWith("/cricket/")
          ? "https://sportscore.com" + m.url : "";

        let time = "Time unavailable";
        if (m.time) {
          const date = new Date(m.time);
          if (!Number.isNaN(date.getTime())) {
            time = date.toLocaleString("en-NP", {
              timeZone: "Asia/Kathmandu",
              dateStyle: "medium",
              timeStyle: "short"
            }) + " (Nepal time)";
          }
        }

        return `
          <article class="match">
            <div class="league">${safe(m.competition || "Cricket")}</div>
            <div class="teams">
              <div class="team">${safe(m.home || "Home")}</div>
              <div class="score">${hasScore ? homeScore + " - " + awayScore : "vs"}</div>
              <div class="team">${safe(m.away || "Away")}</div>
            </div>
            <div class="status">${safe(m.status_text || m.status || "Status unavailable")}</div>
            <div class="time">${safe(time)}</div>
            ${matchUrl ? `<a class="details" href="${matchUrl}" target="_blank" rel="noopener">Match details ↗</a>` : ""}
          </article>`;
      }).join("");
    }

    async function loadMatches() {
      message.textContent = "Loading cricket scores...";
      document.getElementById("refresh").disabled = true;

      try {
        const response = await fetch(API, { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);

        const data = await response.json();
        if (!Array.isArray(data.matches)) {
          throw new Error("Cricket match data was not returned.");
        }

        matches = data.matches;
        showMatches();
      } catch (error) {
        message.textContent = "Could not load scores. Please refresh and try again.";
        matchesBox.innerHTML = "";
      } finally {
        document.getElementById("refresh").disabled = false;
      }
    }

    document.getElementById("refresh").addEventListener("click", loadMatches);
    filter.addEventListener("change", showMatches);
    loadMatches();
    setInterval(loadMatches, 60000);
  </script>
</body>
</html>
